stages:
  - test

test-mr-job:
  script: echo "Running tests for merge request"
  stage: test
  image: ghcr.io/foundry-rs/foundry@sha256:09143a1c5ad22ae6b5fbb3d9ac39a5e0cff6be425836e4f1715dc0e204f9899f
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "git@gitlab.com:"
  script:
    - echo "Install build essentials"
    - apk add --no-cache openssh
    - echo "Install nodejs"
    - apk add --update nodejs npm
    - node --version
    - npm i -g yarn && yarn
    - echo "Build with commit $CI_COMMIT_BRANCH!"
    - forge install
    - forge test
